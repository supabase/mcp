name: Check Management API Types

on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install: true
          install_args: node pnpm
          cache: true
      - name: Install dependencies
        run: pnpm install --ignore-scripts
      - name: Regenerate management API types
        run: pnpm --filter @supabase/mcp-server-supabase generate:management-api-types
      - name: Check for diff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git diff --exit-code packages/mcp-server-supabase/src/management-api/types.ts packages/mcp-server-supabase/src/management-api-v2/types.ts; then
            echo "Management API types are out of date. See the job summary for the update PR."
            echo '## Management API types are out of date' >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
            if pr_url=$(gh api --method GET "repos/$GITHUB_REPOSITORY/pulls" -f state=open -f "head=$GITHUB_REPOSITORY_OWNER:chore/regenerate-management-api-types" --jq '.[0].html_url // empty'); then
              if [ -n "$pr_url" ]; then
                echo "A [generated types update PR]($pr_url) is open. Check that it includes these changes, then merge it and update your branch." >> "$GITHUB_STEP_SUMMARY"
              else
                echo "No generated types update PR is currently open. [Run the sync workflow]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/workflows/sync-management-api-types.yml) to create one, then merge it and update your branch." >> "$GITHUB_STEP_SUMMARY"
              fi
            else
              echo "Could not look up the generated types update PR." >> "$GITHUB_STEP_SUMMARY"
            fi
            exit 1
          fi
